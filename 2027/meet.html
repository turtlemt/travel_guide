            color: #333;
            text-align: center;
        }

            font-size: 14px;
            text-align: center;
            margin-bottom: 20px;
        }
        /* 第一層：簡譜數字（紅色加粗） */
        .abcjs-lyric:nth-of-type(2n+1) {
            font-size: 15px !important;
            font-weight: bold;
            fill: #d9534f !important;
        }
        /* 第二層：歌詞（深灰色） */
